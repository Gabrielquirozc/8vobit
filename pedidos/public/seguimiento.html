<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#241c17">
<meta name="robots" content="noindex">
<title>Tu pedido</title>
<link rel="stylesheet" href="carta.css">
<style>
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  .top { display: flex; align-items: center; gap: 12px; }
  .top .logo { margin: 0; width: 52px; height: 52px; border-radius: 16px; font-size: 1.5rem; border: 0; }
  .top a { color: var(--ink-2); font-size: .92rem; }
  .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px; margin-top: 16px; }
  .num { font: 800 3.2rem/1 var(--font-display); letter-spacing: -.02em; }
  .estado { font: 800 1.5rem/1.2 var(--font-display); margin: 14px 0 4px; }
  .msg { color: var(--ink-2); margin: 0; }
  .steps { list-style: none; padding: 0; margin: 22px 0 4px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .steps li { display: flex; flex-direction: column; gap: 8px; font-size: .78rem; font-weight: 600; color: var(--ink-2); }
  .steps li::before { content: ""; height: 6px; border-radius: 999px; background: var(--line); transition: background .3s var(--ease); }
  .steps li.hecho::before { background: var(--ok); }
  .steps li.actual::before { background: var(--brand); }
  .steps li.actual { color: var(--ink); }
  .anulado .steps { display: none; }
  .items { list-style: none; padding: 0; margin: 0; }
  .items li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .items li:last-child { border-bottom: 0; }
  .items .d { color: var(--ink-2); font-size: .88rem; }
  .row2 { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .row2 > * { flex: 1; text-decoration: none; }
  .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 999px; background: var(--brand); margin-right: 8px; animation: pul 1.6s ease-in-out infinite; vertical-align: middle; }
  @keyframes pul { 50% { opacity: .3; } }
  .upd { color: var(--ink-2); font-size: .8rem; margin-top: 12px; }
  #chat { padding-top: 0; margin-top: -24px; }
  #chat h2 { font: 700 1.05rem/1.2 var(--font-display); margin: 0 0 4px; }
  .hilo { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .hilo li { max-width: 85%; padding: 8px 12px; border-radius: 14px; background: var(--line); overflow-wrap: anywhere; }
  .hilo li.cliente { align-self: flex-end; background: var(--brand); color: var(--brand-ink, #fff); }
  .hilo time { display: block; font-size: .72rem; opacity: .75; margin-top: 2px; }
  .escribir { display: flex; gap: 8px; margin-top: 12px; }
  .escribir textarea { flex: 1; min-height: 44px; resize: vertical; font: inherit; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
  .escribir button { flex: 0 0 auto; }
  .escribir[hidden] { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.7 7.1L3 21l1.9-6.3A8 8 0 1 1 21 12Z"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
</svg>
<main class="wrap" id="app" aria-busy="true">
  <p class="msg">Cargando tu pedido…</p>
</main>
<!-- Fuera de #app: el estado se redibuja cada pocos segundos y no debe borrar lo que el cliente escribe. -->
<section class="wrap" id="chat" hidden>
  <div class="card">
    <h2>Mensajes con el local</h2>
    <p class="msg" id="chatAyuda" style="font-size:.9rem">¿Algún cambio o aviso sobre tu pedido? Escríbele al local aquí.</p>
    <ul class="hilo" id="hilo" aria-live="polite"></ul>
    <form class="escribir" id="fChat">
      <label class="sr-only" for="tChat" style="position:absolute;left:-9999px">Mensaje para el local</label>
      <textarea id="tChat" maxlength="300" rows="1" placeholder="Ej.: voy 10 minutos tarde" required></textarea>
      <button class="primary" type="submit">Enviar</button>
    </form>
  </div>
</section>
<script type="module">
import { api, clp, esc, BASE, fmtTel } from './comun.js';
const token = new URLSearchParams(location.search).get('p') || '';
const PASOS = [['nuevo', 'Recibido'], ['preparacion', 'En cocina'], ['listo', 'Listo'], ['entregado', 'Entregado']];
const TEXTO = {
  nuevo: ['Recibimos tu pedido', 'El local lo confirma en unos minutos.'],
  preparacion: ['Lo estamos preparando', 'Tu pedido ya está en la cocina.'],
  listo: { retiro: ['¡Listo para retirar!', 'Pasa por el local y di tu número de pedido.'], despacho: ['¡Listo! Va en camino', 'Tu pedido salió del local.'] },
  entregado: ['Entregado', '¡Que lo disfrutes! Gracias por pedir directo.'],
  anulado: ['Pedido anulado', 'Si fue un error, escríbele al local.'],
};
let ultimo = null, timer;
async function cargar() {
  let p;
  try { p = await api(`seguimiento/${encodeURIComponent(token)}`); }
  catch (e) {
    if (e.status === 404 || !token) { document.getElementById('app').innerHTML = `<h1 class="estado">No encontramos ese pedido</h1><p class="msg">Revisa que el link esté completo.</p>`; return; }
    document.querySelector('.upd')?.replaceChildren('Sin conexión. Reintentando…'); return programar();
  }
  const [titulo, msg] = p.estado === 'listo' ? TEXTO.listo[p.modalidad] : TEXTO[p.estado];
  const idx = PASOS.findIndex(([k]) => k === p.estado);
  const fin = p.estado === 'entregado' || p.estado === 'anulado';
  const wa = p.local.whatsapp ? `https://wa.me/${p.local.whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent(`Hola, consulto por mi pedido #${p.numero}.`)}` : '';
  document.title = `Pedido #${p.numero} · ${p.local.nombre}`;
  const app = document.getElementById('app');
  app.className = `wrap ${p.estado === 'anulado' ? 'anulado' : ''}`;
  app.removeAttribute('aria-busy');
  app.innerHTML = `
    <div class="top">${p.local.logo ? `<img src="${esc(p.local.logo)}" alt="" width="130" height="47" style="height:47px;width:auto">` : `<div class="logo" aria-hidden="true">${esc(p.local.nombre[0])}</div>`}
      <div><b>${esc(p.local.nombre)}</b><br><a href="${BASE}/${esc(p.local.slug)}">Ver la carta</a></div></div>
    <section class="card" aria-live="polite">
      <div class="muted" style="color:var(--ink-2)">Pedido de ${esc(p.cliente)} · ${p.franja === 'Lo antes posible' ? 'lo antes posible' : esc(p.franja)}</div>
      <div class="num">#${p.numero}</div>
      <h1 class="estado">${fin ? '' : '<span class="pulse" aria-hidden="true"></span>'}${titulo}</h1>
      <p class="msg">${msg}</p>
      <ol class="steps">${PASOS.map(([k, t], i) => `<li class="${i < idx ? 'hecho' : i === idx ? 'actual' : ''}" ${i === idx ? 'aria-current="step"' : ''}>${t}</li>`).join('')}</ol>
    </section>
    ${p.cupon ? `<section class="card" style="border-left:4px solid var(--brand)"><b>Tu próximo pedido tiene ${p.cupon.valor} % de descuento</b>
      <p style="margin:6px 0 0">Usa el código <b style="font-size:1.15rem;letter-spacing:.08em">${esc(p.cupon.codigo)}</b> en la carta${p.cupon.minimo ? ` (desde ${clp(p.cupon.minimo)})` : ''}. Vale hasta el ${esc(new Date(`${p.cupon.vence}T12:00:00`).toLocaleDateString('es-CL', { day: 'numeric', month: 'long' }))}, una vez, con este celular.</p></section>` : ''}
    <section class="card">
      <ul class="items">${p.items.map((i) => `<li><div><b>${i.cantidad}×</b> ${esc(i.nombre)}${i.agregados.length || i.salsas?.length ? `<div class="d">${esc([...i.agregados, ...(i.salsas || [])].join(', '))}</div>` : ''}${i.nota ? `<div class="d" style="color:var(--brand);font-weight:600">Nota: ${esc(i.nota)}</div>` : ''}</div><span class="num" style="font:600 1rem var(--font-body)">${clp(i.precio_unitario * i.cantidad)}</span></li>`).join('')}</ul>
      ${p.costo_despacho ? `<div style="display:flex;justify-content:space-between;color:var(--ink-2);padding-top:10px"><span>Despacho</span><span>${clp(p.costo_despacho)}</span></div>` : ''}
      ${p.descuento ? `<div style="display:flex;justify-content:space-between;color:var(--ink-2);padding-top:6px"><span>${esc(p.promo || 'Descuento')}</span><span>−${clp(p.descuento)}</span></div>` : ''}
      <div class="tot"><span>Total</span><span>${clp(p.total)}</span></div>
      <div style="color:var(--ink-2);font-size:.9rem">${p.pagado ? 'Pagado' : `Pagas al ${p.modalidad === 'despacho' ? 'recibir' : 'retirar'}: efectivo, transferencia o tarjeta`}</div>
      ${!p.pagado && p.local.transferencia ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600;color:var(--brand)">Datos para transferir</summary>
        <dl style="display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0">${[['Titular', 'titular'], ['RUT', 'rut'], ['Banco', 'banco'], ['Tipo de cuenta', 'tipo'], ['N° de cuenta', 'numero'], ['Correo', 'email']]
          .filter(([, k]) => p.local.transferencia[k]).map(([t, k]) => `<dt style="color:var(--ink-2)">${t}</dt><dd style="margin:0;font-weight:600">${esc(p.local.transferencia[k])}</dd>`).join('')}</dl>
        <p style="color:var(--ink-2);font-size:.85rem;margin:0">Indica el pedido #${p.numero} en el comentario de la transferencia.</p></details>` : ''}
    </section>
    <div class="row2">
      ${wa ? `<a class="ghost" style="display:flex;align-items:center;justify-content:center;gap:8px" href="${wa}" target="_blank" rel="noopener"><svg class="ico"><use href="#i-msg"/></svg>WhatsApp</a>` : ''}
      ${p.local.telefono ? `<a class="ghost" style="display:flex;align-items:center;justify-content:center;gap:8px" href="tel:+${esc(p.local.telefono)}" aria-label="Llamar al local ${esc(fmtTel(p.local.telefono))}"><svg class="ico"><use href="#i-phone"/></svg>Llamar</a>` : ''}
      <a class="ghost" style="display:flex;align-items:center;justify-content:center" href="${BASE}/${esc(p.local.slug)}">Pedir de nuevo</a>
    </div>
    <p class="upd">${fin ? '' : 'Esta página se actualiza sola.'}</p>`;
  pintarChat(p.mensajes);
  if (ultimo && ultimo !== p.estado) navigator.vibrate?.([60, 40, 60]);
  ultimo = p.estado;
  if (!fin) programar();
}
// Mensajes del pedido: el hilo se redibuja solo si cambió, y el formulario no se toca.
let firmaChat = '';
function pintarChat(M) {
  if (!M) return;
  const chat = document.getElementById('chat');
  chat.hidden = !M.abierto && !M.lista.length;
  document.getElementById('fChat').hidden = !M.abierto;
  document.getElementById('chatAyuda').textContent = M.abierto ? '¿Algún cambio o aviso sobre tu pedido? Escríbele al local aquí.' : 'El pedido terminó: los mensajes están cerrados.';
  const firma = M.lista.map((m) => m.id).join(',');
  if (firma === firmaChat) return;
  const nuevoDelLocal = firmaChat && M.lista.at(-1)?.de === 'local';
  firmaChat = firma;
  document.getElementById('hilo').innerHTML = M.lista.map((m) => `<li class="${m.de}"><span class="sr-only" style="position:absolute;left:-9999px">${m.de === 'cliente' ? 'Tú' : 'El local'}: </span>${esc(m.texto)}<time>${m.de === 'cliente' ? 'Tú' : 'Local'} · ${esc(m.creado.slice(11, 16))}</time></li>`).join('');
  if (nuevoDelLocal) navigator.vibrate?.([60, 40, 60]);
}
document.getElementById('fChat').addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = document.getElementById('tChat'), b = e.target.querySelector('button');
  if (!t.value.trim()) return;
  b.disabled = true;
  try { pintarChat(await api(`seguimiento/${encodeURIComponent(token)}/mensajes`, { method: 'POST', body: { texto: t.value } })); t.value = ''; }
  catch (err) { alert(err.message || 'No se pudo enviar. Intenta de nuevo.'); }
  finally { b.disabled = false; }
});
// Más seguido mientras la pestaña está a la vista; se detiene al terminar.
function programar() { clearTimeout(timer); timer = setTimeout(cargar, document.hidden ? 30000 : 5000); }
document.addEventListener('visibilitychange', () => { if (!document.hidden && ultimo && !['entregado', 'anulado'].includes(ultimo)) cargar(); });
cargar();
</script>
</body>
</html>
