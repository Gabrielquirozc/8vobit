<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Carta imprimible</title>
<style>
  @page { size: A4; margin: 14mm; }
  body { font-family: Georgia, "Times New Roman", serif; color: #111; max-width: 190mm; margin: 0 auto; padding: 16px; }
  h1 { text-align: center; font-size: 34px; margin: 0 0 4px; letter-spacing: .04em; }
  .sub { text-align: center; color: #555; margin-bottom: 18px; }
  .cats { columns: 2; column-gap: 12mm; }
  section { break-inside: avoid; margin-bottom: 14px; }
  h2 { font-size: 18px; border-bottom: 2px solid #111; padding-bottom: 2px; margin: 0 0 6px; }
  .p { display: flex; gap: 6px; align-items: baseline; margin: 5px 0; }
  .p .n { font-weight: 700; } .p .dots { flex: 1; border-bottom: 1px dotted #888; }
  .d { font-size: 12px; color: #444; margin: -2px 0 4px; }
  .noprint { text-align: center; margin-bottom: 12px; font-family: system-ui; }
  @media print { .noprint { display: none; } }
</style>
</head>
<body>
<div class="noprint"><button onclick="print()">Imprimir o guardar como PDF</button></div>
<h1 id="nom"></h1><div class="sub" id="sub"></div>
<div class="cats" id="cats"></div>
<script type="module">
import { api, clp, esc } from './comun.js';
const M = await api('panel/carta');
document.getElementById('nom').textContent = M.local.nombre;
document.getElementById('sub').textContent = (M.local.instagram ? '@' + M.local.instagram + ' · ' : '') + 'Precios vigentes al ' + new Date().toLocaleDateString('es-CL');
document.getElementById('cats').innerHTML = M.categorias.map((c) => {
  const ps = c.productos.filter((p) => p.activo);
  return ps.length ? `<section><h2>${esc(c.nombre)}</h2>${ps.map((p) => `<div class="p"><span class="n">${esc(p.nombre)}</span><span class="dots"></span><span>${p.precio_pendiente || !p.precio ? 'Consultar' : clp(p.precio)}</span></div>${p.descripcion ? `<div class="d">${esc(p.descripcion)}</div>` : ''}`).join('')}</section>` : '';
}).join('');
</script>
</body>
</html>
