<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel · Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="carta.css">
<link rel="stylesheet" href="leaflet.css">
<link rel="manifest" href="panel.webmanifest">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* Panel para una tablet en el ventanal: mismos tokens que la carta, botones
     grandes y un solo paso principal por pedido. */
  body { background: var(--surface-2); }
  .ico { width: 20px; height: 20px; }
  .bar { position: sticky; top: 0; z-index: 10; background: #1f1a17; color: #fff; display: flex; align-items: center; gap: 6px; padding: 8px 12px; flex-wrap: wrap; }
  .bar .marca { font: 800 1.15rem var(--font-display); margin-right: 8px; }
  .tab { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: #f6efe6cc; font-weight: 600; }
  .tab[aria-selected="true"] { background: #fff; color: #1f1a17; }
  .tab .badge { background: var(--brand); color: #fff; border-radius: 999px; min-width: 22px; padding: 1px 7px; font-size: .78rem; }
  .bar .sp { flex: 1; }
  .bar .kpi { font-size: .9rem; color: #f6efe6cc; margin-right: 6px; }
  .icobtn { width: 44px; height: 44px; border-radius: 999px; border: 0; background: #ffffff1a; color: #fff; display: grid; place-items: center; }
  .icobtn[aria-pressed="true"] { background: var(--mustard); color: #1f1a17; }
  main { padding: 14px; max-width: none; }
  h2.t { font: 800 1.1rem var(--font-display); margin: 4px 4px 10px; display: flex; align-items: center; gap: 8px; }
  h2.t .n { background: var(--surface); border-radius: 999px; padding: 0 9px; font: 600 .85rem var(--font-body); color: var(--ink-2); }

  /* pedidos */
  .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .ped { background: var(--surface); border-radius: var(--r); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); border: 2px solid transparent; }
  .ped.nuevo { border-color: var(--brand); animation: pulso 1.6s ease-in-out 3; }
  @keyframes pulso { 50% { box-shadow: 0 0 0 6px var(--brand-soft); } }
  .ped .cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ped .numero { font: 800 1.9rem/1 var(--font-display); }
  .ped .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip2 { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .chip2 .ico { width: 14px; height: 14px; }
  .chip2.ok { background: #e6f4e7; color: #1d5e21; } .chip2.warn { background: #fff3cd; color: #7a5200; } .chip2.mos { background: var(--brand-soft); color: var(--brand); }
  .ped ul { list-style: none; padding: 0; margin: 10px 0; font-size: 1.02rem; }
  .ped li { padding: 5px 0; border-bottom: 1px dashed var(--line); }
  .ped li:last-child { border-bottom: 0; }
  .ped li .ag { display: block; color: var(--ink-2); font-size: .88rem; padding-left: 2.4ch; }
  .nota { display: flex; gap: 6px; background: #fff3cd; color: #5c4300; padding: 8px 10px; border-radius: var(--r-sm); margin: 6px 0; font-size: .92rem; }
  .ped .pie { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
  .ped .total { font-weight: 800; font-size: 1.1rem; }
  .paso { width: 100%; min-height: 54px; margin-top: 10px; border: 0; border-radius: var(--r-sm); background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .paso.verde { background: var(--ok); color: #fff; }
  .acc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .acc > * { min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: .8rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; }
  .acc .ico { width: 18px; height: 18px; }
  .acc .peligro { color: var(--danger); }
  .vacio { color: var(--ink-2); text-align: center; padding: 28px 0; border: 2px dashed var(--line); border-radius: var(--r); }

  /* venta rápida */
  .venta { display: grid; grid-template-columns: 1fr 380px; gap: 14px; align-items: start; }
  @media (max-width: 900px) {
    .venta { grid-template-columns: 1fr; }
    /* En tablet vertical la venta en curso queda fija abajo, siempre a la vista. */
    .ticket { position: sticky; top: auto; bottom: 0; max-height: 45dvh; box-shadow: 0 -6px 24px rgb(31 26 23 / .12); }
  }
  .tile .ini { font: 800 2.2rem var(--font-display); color: var(--ink-2); opacity: .5; }
  .cat-chips { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; }
  .cat-chips button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
  .cat-chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { border: 0; padding: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); text-align: left; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .tile:active { transform: scale(.98); }
  .tile .art { aspect-ratio: 4 / 3; border-radius: 0; }
  .tile .t { padding: 8px 10px 10px; } .tile .n { font-weight: 700; font-size: .92rem; line-height: 1.25; } .tile .p { color: var(--ink-2); font-size: .88rem; }
  .tile .q { position: absolute; top: 6px; right: 6px; background: var(--brand); color: #fff; border-radius: 999px; min-width: 26px; height: 26px; display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
  .ticket { position: sticky; top: 76px; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); display: flex; flex-direction: column; max-height: calc(100dvh - 100px); }
  .ticket h2 { margin: 0; padding: 14px 16px 6px; font: 800 1.1rem var(--font-display); }
  .ticket .lines { overflow-y: auto; padding: 0 16px; flex: 1; min-height: 80px; }
  .ticket .line { grid-template-columns: 1fr auto; }
  .ticket .foot { padding: 12px 16px 16px; border-top: 1px solid var(--line); }
  .ticket .tot { padding: 0 0 10px; }

  /* cobro */
  .total-big { font: 800 2.6rem var(--font-display); text-align: center; margin: 4px 0 12px; }
  .medios { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .medios button { min-height: 64px; border-radius: var(--r-sm); border: 2px solid var(--line); background: var(--surface); font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .medios button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
  .rapidos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .rapidos button { min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
  .vuelto { font: 800 1.5rem var(--font-display); text-align: center; margin: 12px 0 0; min-height: 1.5em; }
  .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); font-weight: 600; }
  .switch input { width: 22px; height: 22px; accent-color: var(--brand); }

  /* caja y carta */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .kpis div { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); color: var(--ink-2); font-size: .9rem; }
  .kpis b { display: block; font: 800 1.6rem var(--font-display); color: var(--ink); }
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
  td, th { padding: 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: .93rem; }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  h3 { font: 800 1.05rem var(--font-display); margin: 22px 0 8px; }
  .foto { width: 112px; aspect-ratio: 4 / 3; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-2); font-size: .8rem; }
  .foto img { width: 100%; height: 100%; object-fit: cover; }
  .mini-btn { display: inline-flex; align-items: center; min-height: 36px; margin-top: 6px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: .85rem; font-weight: 600; background: var(--surface); color: var(--ink); }
  .link { background: none; border: 0; color: var(--ink-2); font-size: .85rem; padding: 6px; text-decoration: underline; }
  td input[type=number] { width: 110px; min-height: 44px; padding: 0 10px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 16px; }
  td label.ck { display: flex; align-items: center; gap: 8px; min-height: 44px; } td label.ck input { width: 20px; height: 20px; accent-color: var(--brand); }
  .tile .emoji, .art .emoji { font-size: 44px; line-height: 1; }
  .ped li .ag.obs { color: var(--brand); font-weight: 700; display: flex; align-items: center; gap: 4px; }
  .ped li .ag.obs .ico { width: 14px; height: 14px; }
  /* Barra superior: una línea en pantallas anchas; en el resto, nombre y acciones arriba
     y las pestañas en una segunda línea que se desplaza de lado (nunca se parte). */
  .bar { flex-wrap: nowrap; }
  .tabs-nav { display: flex; gap: 4px; min-width: 0; }
  .tab, .pausa { white-space: nowrap; }
  @media (max-width: 1640px) { .bar .kpi { display: none; } }
  @media (max-width: 1499px) {
    .bar { flex-wrap: wrap; row-gap: 6px; }
    .bar .marca { order: 0; } .bar .sp { order: 1; } .bar .pausa { order: 2; } #sonido { order: 3; } #salir { order: 4; }
    .tabs-nav { order: 5; flex: 0 0 100%; overflow-x: auto; scrollbar-width: none; margin: 0 -12px; padding: 0 12px 2px; }
    .tabs-nav::-webkit-scrollbar { display: none; }
    .tab { flex: none; }
  }
  @media (max-width: 600px) {
    .pausa #pausaTxt { display: none; } .pausa { width: 44px; padding: 0; justify-content: center; }
    .tab .ico { display: none; } .tab { padding: 0 12px; }
  }
  .pausa { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #ffffff33; background: transparent; color: #fff; font-weight: 600; font-size: .88rem; }
  .pausa .dot { width: 10px; height: 10px; border-radius: 999px; background: #4ade80; box-shadow: 0 0 0 3px #4ade8033; }
  .pausa[aria-pressed="true"] { background: var(--mustard); color: #1f1a17; border-color: var(--mustard); }
  .pausa[aria-pressed="true"] .dot { background: #b42318; box-shadow: none; }
  .logo-prev { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .lp { border-radius: var(--r-sm); padding: 12px; display: grid; place-items: center; min-height: 90px; }
  .lp img { max-width: 100%; max-height: 70px; } .lp.oscuro { background: #241c17; } .lp.claro { background: #fbf6ee; border: 1px solid var(--line); }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .local-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; align-items: start; }
  .cardf { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
  .cardf h3 { margin-top: 0; }
  .ayuda { color: var(--ink-2); font-size: .85rem; margin: 6px 0 0; }
  .horario { box-shadow: none; } .horario th { font-weight: 600; } .horario td, .horario th { padding: 6px 4px; border: 0; }
  .horario { table-layout: fixed; } .horario th { width: 38%; text-align: left; } .horario th .ck { font-weight: 600; }
  .horario input[type=time] { width: 100%; min-width: 0; min-height: 44px; padding: 0 8px; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); font-size: 16px; }
  .horario input:disabled { opacity: .4; }
  .guardar { position: sticky; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 12px; padding: 12px 0; background: linear-gradient(transparent, var(--surface-2) 30%); }
  .res-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .ico-b { width: 44px; padding: 0; display: grid; place-items: center; }
  .ico-b:disabled { opacity: .35; }
  .kpis6 { grid-template-columns: repeat(3, 1fr); }
  .extra-sug { margin: 12px 0 0; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px dashed var(--line); color: var(--ink-2); }
  .extra-sug b { color: var(--ink); }
  .ofrece { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 10px 16px 4px; }
  .ofrece .k { font-size: .85rem; font-weight: 700; color: var(--ink-2); margin-right: 2px; }
  .ofrece .opt { font-size: .85rem; padding: 6px 10px; } .ofrece .opt .ico { width: 14px; height: 14px; }
  @media (max-width: 900px) { .kpis6 { grid-template-columns: repeat(2, 1fr); } }
  .kpis6 .k { display: block; font-size: .85rem; } .kpis6 .sub { display: block; font-size: .82rem; margin-top: 4px; color: var(--ink-2); }
  .kpis6 b.txt { font-size: 1.25rem; line-height: 1.2; margin-top: 4px; }
  .kpis6 .destacado { background: var(--ink); color: #f6efe6cc; } .kpis6 .destacado b { color: #fff; } .kpis6 .destacado .sub { color: #f6efe6b3; }
  .delta { display: block; font-size: .85rem; font-weight: 700; margin-top: 4px; } .delta span { font-weight: 400; color: var(--ink-2); }
  .delta.up { color: var(--ok); } .delta.down { color: var(--danger); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-top: 14px; align-items: start; }
  .chart { margin: 0; background: var(--surface); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
  .chart figcaption { font: 800 1rem var(--font-display); margin-bottom: 10px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 160px; border-bottom: 1px solid var(--line); }
  .bar-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: default; outline-offset: 2px; }
  .bar-col:hover .vbar, .bar-col:focus .vbar { filter: brightness(.88); }
  .vbar { width: min(70%, 36px); background: var(--brand); border-radius: 4px 4px 0 0; transition: filter .15s; }
  .bar-val { font-size: .75rem; font-weight: 700; color: var(--ink); margin-bottom: 2px; white-space: nowrap; width: 0; display: flex; justify-content: center; overflow: visible; }
  .bars-x { display: flex; gap: 2px; } .bars-x span { flex: 1; min-width: 0; overflow: hidden; text-align: center; font-size: .72rem; color: var(--ink-2); padding-top: 4px; }
  .tabla { margin-top: 10px; font-size: .85rem; } .tabla summary { cursor: pointer; color: var(--ink-2); }
  .tabla table { box-shadow: none; margin-top: 6px; } .tabla td { padding: 4px 8px; }
  .tip { position: absolute; z-index: 50; background: var(--ink); color: var(--bg); font-size: .82rem; font-weight: 600; padding: 6px 10px; border-radius: 8px; pointer-events: none; opacity: 0; transition: opacity .12s; }
  .tip.on { opacity: 1; }
  /* ---- Carta y precios ---- */
  .ctools { position: sticky; top: var(--barh, 64px); z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0; background: var(--surface-2); }
  .ctools .search { flex: 1 1 260px; max-width: 380px; margin: 0; }
  .ctools .primary.chico, .ghostb { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
  .ctools .primary.chico { width: auto; flex: none; }
  .ghostb { border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
  .ghostb.fuerte { border-color: var(--ink); }
  .ghostb.peligro { color: var(--danger); border-color: #f2c4bf; }
  .ghostb:disabled { opacity: .35; }
  .ghostb .ico { width: 16px; height: 16px; }
  .cfiltros { display: flex; gap: 6px; flex-wrap: wrap; }
  .cfiltros button { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .88rem; }
  .cfiltros button .num { color: var(--ink-2); font-weight: 700; margin-left: 2px; }
  .cfiltros button.alerta .num { color: var(--danger); }
  .cfiltros button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); } .cfiltros button[aria-pressed="true"] .num { color: inherit; }
  .cfiltros button:disabled { opacity: .45; }
  .cjump { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 6px; }
  .cjump button { flex: none; border: 0; background: none; color: var(--ink-2); font-weight: 700; font-size: .9rem; padding: 6px 10px; border-radius: 8px; }
  .cjump button:hover { background: var(--surface); color: var(--ink); }
  .ccat { margin-top: 14px; scroll-margin-top: 140px; }
  .ccat header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 2px 8px; }
  .ccat h3 { margin: 0; display: flex; align-items: center; gap: 8px; } .ccat h3 .n { font: 600 .8rem var(--font-body); background: var(--surface); border-radius: 999px; padding: 1px 8px; color: var(--ink-2); }
  .ccat .ghostb { min-height: 38px; padding: 0 12px; font-size: .85rem; }
  .ck.mini { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--ink-2); font-weight: 600; } .ck.mini input { width: 18px; height: 18px; accent-color: var(--brand); }
  .sp { flex: 1; }
  .plist { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .prow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 150px 92px 92px 44px; gap: 12px; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .prow:last-child { border-bottom: 0; }
  .prow.off .pthumb, .prow.off .pname { opacity: .5; }
  .pthumb { width: 64px; height: 48px; border-radius: 10px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; position: relative; }
  .pthumb img { width: 100%; height: 100%; object-fit: cover; }
  .pthumb .emoji { font-size: 22px; } .pthumb small { position: absolute; bottom: 1px; font-size: .62rem; color: var(--ink-2); font-weight: 600; }
  .pthumb.cargando { opacity: .4; }
  .pthumb.grande { width: 140px; height: 105px; flex: none; } .pthumb.grande .emoji { font-size: 40px; } .pthumb.grande small { font-size: .72rem; bottom: 6px; }
  .pname { text-align: left; background: none; border: 0; padding: 4px 0; min-width: 0; color: var(--ink); cursor: pointer; }
  .pname b { font-size: .98rem; }
  .pname .pdesc { display: block; color: var(--ink-2); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badges { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 6px; vertical-align: 1px; }
  .bd { font-style: normal; font-size: .72rem; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
  .bd.warn { background: #fdecea; color: var(--danger); } .bd.off { background: #eee; color: #666; }
  .money { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: var(--r-sm); background: var(--surface); padding-left: 10px; }
  .money:focus-within { border-color: var(--ink); }
  .money span { color: var(--ink-2); font-weight: 600; }
  .money input { border: 0 !important; outline: 0; min-height: 44px !important; padding: 0 10px 0 4px !important; width: 100%; font: 600 16px var(--font-body); background: transparent; font-variant-numeric: tabular-nums; }
  .pprice { position: relative; } .pprice .ok { position: absolute; right: -16px; top: 50%; transform: translateY(-50%); color: var(--ok); font-weight: 800; }
  .pprice.falta .money { border-color: var(--danger); background: #fff7f6; }
  .psw { display: flex; flex-direction: column; align-items: center; gap: 2px; } .psw small { font-size: .7rem; color: var(--ink-2); font-weight: 600; }
  .pedit { width: 44px; height: 44px; border-radius: 999px; border: 0; background: transparent; display: grid; place-items: center; color: var(--ink-2); }
  .pedit:hover { background: var(--surface-2); }
  .sw { position: relative; display: inline-block; width: 46px; height: 28px; flex: none; cursor: pointer; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .sw span { position: absolute; inset: 0; border-radius: 999px; background: #cfc5b8; transition: background .15s; pointer-events: none; }

<script type="module">
import { api, clp, esc, BASE, emojiDe, fmtTel } from './comun.js';
import * as H from './hex.js';
const $ = (id) => document.getElementById(id);
const ico = (n) => `<svg class="ico" aria-hidden="true"><use href="#i-${n}"/></svg>`;
document.querySelectorAll('[data-close]').forEach((b) => b.onclick = () => b.closest('dialog').close());
// Alto real de la barra superior (cambia al pasar a dos líneas): las barras fijas se ubican bajo ella.
new ResizeObserver(([e]) => document.documentElement.style.setProperty('--barh', `${Math.round(e.target.offsetHeight)}px`)).observe(document.querySelector('.bar'));
let D = null, M = null, conocidos = null, audio = null, vista = 'pedidos';
const MEDIO = { efectivo: 'Efectivo', tarjeta: 'Tarjeta', transferencia: 'Transferencia', otro: 'Otro' };
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2200); }

// ---------- sonido ----------
function beep() {
  if (!audio) return;
  for (const [t, f] of [[0, 880], [.25, 1175]]) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = f; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.35, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + t + .4);
    o.start(audio.currentTime + t); o.stop(audio.currentTime + t + .4);
  }
}
$('sonido').onclick = () => {
  audio = audio || new AudioContext(); audio.resume(); beep();
  $('sonido').setAttribute('aria-pressed', 'true'); $('sonido').innerHTML = ico('bell'); $('sonido').setAttribute('aria-label', 'Sonido activo');
};

const patch = (id, body) => api(`panel/pedidos/${id}`, { method: 'PATCH', body });

const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

// ---------- carta y precios ----------
// Pensado para que el dueño ingrese y corrija datos rápido desde la tablet: buscador y
// filtros arriba, una fila por producto con precio e interruptores, y una ficha para todo
// lo demás. Cada cambio se guarda solo (y se avisa), sin volver a dibujar la página.
const digitos = (v) => Number(String(v ?? '').replace(/\D/g, '')) || 0;
const miles = (n) => (n ? Math.round(n).toLocaleString('es-CL') : '');
// Campo de dinero: muestra "4.990" mientras se escribe; el valor real se lee con digitos().
function dinero(id, val, extra = '') {
  return `<div class="money"><span aria-hidden="true">$</span><input ${id ? `id="${id}"` : ''} inputmode="numeric" autocomplete="off" value="${miles(val)}" ${extra}></div>`;
}
document.addEventListener('input', (e) => {
  const t = e.target; if (!t.closest?.('.money')) return;
  const fin = t.value.length - t.selectionStart, v = miles(digitos(t.value));
  t.value = v; const pos = Math.max(0, v.length - fin); t.setSelectionRange(pos, pos);
});
let filtro = { q: '', ver: 'todos' };
const FILTROS = [['todos', 'Todos'], ['sinprecio', 'Sin precio'], ['agotados', 'No disponibles'], ['sinfoto', 'Sin foto']];
const pasa = (p) => {
  const q = filtro.q.trim().toLowerCase();
  if (q && !`${p.nombre} ${p.descripcion || ''}`.toLowerCase().includes(q)) return false;
  return filtro.ver === 'sinprecio' ? p.precio_pendiente || !p.precio : filtro.ver === 'agotados' ? !p.activo : filtro.ver === 'sinfoto' ? !p.imagen : true;
};
const sw = (attrs, on, label) => `<label class="sw" title="${label}"><input type="checkbox" ${on ? 'checked' : ''} ${attrs} aria-label="${label}"><span></span></label>`;
function filaProducto(p, c) {
  const sinPrecio = p.precio_pendiente || !p.precio;
  return `<div class="prow ${p.activo ? '' : 'off'}" data-row="${p.id}">
    <label class="pthumb" title="Cambiar foto">${p.imagen ? `<img src="${esc(p.imagen)}" alt="" loading="lazy">` : `<span class="emoji">${emojiDe(p.nombre, c.nombre)}</span><small>Foto</small>`}<input type="file" accept="image/*" hidden data-foto="${p.id}"></label>
    <button type="button" class="pname" data-editar="${p.id}"><b>${esc(p.nombre)}</b>
      <span class="badges">${sinPrecio ? '<i class="bd warn">Sin precio</i>' : ''}${p.incluye ? `<i class="bd">Elige ${p.incluye} ingr.</i>` : ''}${p.destacado ? '<i class="bd">★ Destacado</i>' : ''}${p.activo ? '' : '<i class="bd off">No disponible</i>'}</span>
      ${p.descripcion ? `<span class="pdesc">${esc(p.descripcion)}</span>` : ''}</button>
    <div class="pprice ${sinPrecio ? 'falta' : ''}"><div class="money"><span aria-hidden="true">$</span><input inputmode="numeric" autocomplete="off" value="${miles(p.precio)}" placeholder="Precio" data-precio="${p.id}" aria-label="Precio de ${esc(p.nombre)}"></div><span class="ok" aria-live="polite"></span></div>
    <div class="psw psw-a"><small>Disponible</small>${sw(`data-p="${p.id}" data-f="activo"`, p.activo, `Disponible: ${esc(p.nombre)}`)}</div>
    <div class="psw psw-s">${p.incluye ? '' : `<small>Sugerir</small>${sw(`data-p="${p.id}" data-f="sugerir"`, p.sugerir, `Sugerir como acompañamiento: ${esc(p.nombre)}`)}`}</div>
    <button type="button" class="pedit" data-editar="${p.id}" aria-label="Editar ${esc(p.nombre)}">${ico('dots')}</button>

}
function pintarFiltros() {
  const todos = M.categorias.flatMap((c) => c.productos);
  const n = { todos: todos.length, sinprecio: todos.filter((p) => p.precio_pendiente || !p.precio).length, agotados: todos.filter((p) => !p.activo).length, sinfoto: todos.filter((p) => !p.imagen).length };
  $('cfiltros').innerHTML = FILTROS.map(([k, t]) => `<button type="button" data-ver="${k}" aria-pressed="${filtro.ver === k}" ${k !== 'todos' && !n[k] && filtro.ver !== k ? 'disabled' : ''} class="${k === 'sinprecio' && n[k] ? 'alerta' : ''}">${t} <span class="num">${n[k]}</span></button>`).join('');
}
function pintarListaCarta() {
  pintarFiltros();
  const html = M.categorias.map((c, ci) => {
    const ps = c.productos.filter(pasa);
    if (!ps.length && (filtro.q || filtro.ver !== 'todos')) return '';
    return `<section class="ccat" id="ccat-${c.id}"><header>
        <h3>${esc(c.nombre)} <span class="n">${c.productos.length}</span></h3>
        <label class="ck mini" title="Ofrecer mostaza, ketchup y demás salsas en esta categoría"><input type="checkbox" data-salsas="${c.id}" ${c.salsas ? 'checked' : ''}> Ofrece salsas</label>
        <span class="sp"></span>
        <button type="button" class="ghostb" data-cat-mover="${c.id}" data-d="-1" ${ci ? '' : 'disabled'} aria-label="Subir categoría">↑</button>
        <button type="button" class="ghostb" data-cat-mover="${c.id}" data-d="1" ${ci < M.categorias.length - 1 ? '' : 'disabled'} aria-label="Bajar categoría">↓</button>
        <button type="button" class="ghostb" data-cat-renombrar="${c.id}">Renombrar</button>
        <button type="button" class="ghostb fuerte" data-nuevo="${c.id}">${ico('plus')}Producto</button>
      </header>
      <div class="plist">${ps.map((p) => filaProducto(p, c)).join('') || '<p class="vacio">Sin productos. Usa "+ Producto" para agregar el primero.</p>'}</div></section>`;

  $('clista').innerHTML = html || `<p class="vacio">Nada coincide con "${esc(filtro.q)}".</p>`;

const chipAg = (a, editar) => editar
  ? `<span class="agc ed"><button type="button" data-ag-renombrar="${a.id}">${esc(a.nombre)} ✎</button><button type="button" class="x" data-ag-quitar="${a.id}" aria-label="Quitar ${esc(a.nombre)}">${ico('x')}</button></span>`

async function pintarHistorial() {

  $('chistT').innerHTML = h.length ? `<table><tr><th>Fecha</th><th>Producto</th><th class="r">Antes</th><th class="r">Ahora</th></tr>${h.map((r) =>

}
const prodPorId = (id) => M.categorias.flatMap((c) => c.productos).find((p) => p.id === Number(id));
const guardado = (msg = 'Guardado') => toast(`✓ ${msg}`);
// Precio: se guarda al salir del campo o con Enter; un cambio grande pide confirmación
// (un cero de más o de menos es el error más común al tipear en la tablet).
async function guardarPrecio(inp) {
  const p = prodPorId(inp.dataset.precio), nuevo = digitos(inp.value);
  if (nuevo === p.precio && !(p.precio_pendiente && nuevo)) return;
  if (!nuevo) { inp.value = miles(p.precio); return; }
  if (p.precio && (nuevo > p.precio * 1.8 || nuevo < p.precio * 0.55) && !confirm(`¿Cambiar ${p.nombre} de ${clp(p.precio)} a ${clp(nuevo)}?`)) { inp.value = miles(p.precio); return; }
  try {
    await api(`panel/productos/${p.id}`, { method: 'PATCH', body: { precio: nuevo } });
    p.precio = nuevo; p.precio_pendiente = 0;
    const ok = inp.closest('.pprice'); ok.classList.remove('falta'); ok.querySelector('.ok').textContent = '✓';
    setTimeout(() => { ok.querySelector('.ok').textContent = ''; }, 1600);
    inp.closest('.prow').querySelector('.bd.warn')?.remove();
    pintarFiltros();
  } catch (e) { alert(e.message); inp.value = miles(p.precio); }
}
$('v-carta').addEventListener('focusout', (e) => { if (e.target.dataset?.precio) guardarPrecio(e.target); });
$('v-carta').addEventListener('keydown', (e) => {
  if (!e.target.dataset?.precio) return;
  if (e.key === 'Enter') { e.preventDefault(); const l = [...$('clista').querySelectorAll('[data-precio]')]; const i = l.indexOf(e.target); (l[i + 1] || e.target).focus(); if (!l[i + 1]) e.target.blur(); }
  if (e.key === 'Escape') { e.target.value = miles(prodPorId(e.target.dataset.precio).precio); e.target.blur(); }
});
$('v-carta').addEventListener('focusin', (e) => { if (e.target.dataset?.precio) setTimeout(() => e.target.select(), 0); });

  if ((b = t('[data-editar]'))) return abrirProducto(prodPorId(b.dataset.editar));

  if ((b = t('#cnuevacat'))) { const n = prompt('Nombre de la nueva categoría (ej: Promociones):'); if (n?.trim()) { await api('panel/categorias', { method: 'POST', body: { nombre: n } }); guardado('Categoría creada'); pintarCarta(); } return; }
  if ((b = t('[data-cat-renombrar]'))) { const c = M.categorias.find((x) => x.id === Number(b.dataset.catRenombrar)); const n = prompt('Nuevo nombre de la categoría:', c.nombre); if (n?.trim() && n !== c.nombre) { await api(`panel/categorias/${c.id}`, { method: 'PATCH', body: { nombre: n } }); guardado(); pintarCarta(); } return; }
  if ((b = t('[data-cat-mover]'))) { await api(`panel/categorias/${b.dataset.catMover}`, { method: 'PATCH', body: { mover: Number(b.dataset.d) } }); pintarCarta(); return; }

  if ((b = t('[data-ag-renombrar]'))) { const a = M.agregados.find((x) => x.id === Number(b.dataset.agRenombrar)); const n = prompt('Nuevo nombre:', a.nombre); if (n?.trim() && n !== a.nombre) { try { await api(`panel/agregados/${a.id}`, { method: 'PATCH', body: { nombre: n } }); a.nombre = n.trim(); pintarAgregados(); guardado(); } catch (err) { alert(err.message); } } return; }
  if ((b = t('[data-ag-quitar]'))) { const a = M.agregados.find((x) => x.id === Number(b.dataset.agQuitar)); if (confirm(`¿Quitar "${a.nombre}" de la lista? Los pedidos anteriores no cambian.`)) { await api(`panel/agregados/${a.id}`, { method: 'PATCH', body: { archivado: true } }); M.agregados = M.agregados.filter((x) => x !== a); pintarAgregados(); guardado('Quitado'); } return; }
  if ((b = t('[data-a]'))) {
    const a = M.agregados.find((x) => x.id === Number(b.dataset.a)), on = !a.disponible;
    await api(`panel/agregados/${a.id}`, { method: 'PATCH', body: { disponible: on } });
    a.disponible = on ? 1 : 0; b.outerHTML = chipAg(a, false); guardado(on ? `${a.nombre}: disponible` : `${a.nombre}: agotado`);
  }
};

// Achica la foto en el navegador (4:3, 1000 px, WebP) antes de subirla: el
// celular del dueño saca fotos de 4 MB y el servidor tiene poca memoria.
// Con { contener: true } (logos) no recorta ni rellena: conserva proporción y transparencia.
async function aWebp(file, { contener = false } = {}) {
  const bmp = await createImageBitmap(file);
  let W = 1000, H = 750, r = Math.max(W / bmp.width, H / bmp.height);
  if (contener) { r = Math.min(1, 900 / bmp.width, 600 / bmp.height); W = Math.round(bmp.width * r); H = Math.round(bmp.height * r); }
  const w = bmp.width * r, h = bmp.height * r;
  const cv = Object.assign(document.createElement('canvas'), { width: W, height: H });
  cv.getContext('2d').drawImage(bmp, (W - w) / 2, (H - h) / 2, w, h);
  for (const q of [0.82, 0.7, 0.55]) {
    const b = await new Promise((ok) => cv.toBlob(ok, 'image/webp', q));
    if (b && b.type === 'image/webp' && b.size < 580e3) return b;
  }
  throw new Error('Este navegador no pudo convertir la foto. Prueba con Chrome.');
}
async function subirFoto(id, file) {
  const r = await fetch(`${BASE}/api/panel/productos/${id}/imagen`, { method: 'PUT', headers: { 'Content-Type': 'image/webp' }, body: await aWebp(file) });
  if (!r.ok) throw new Error((await r.json()).error);
}

  const t = e.target;
  if (t.dataset.foto) {
    const th = t.closest('.pthumb'); th.classList.add('cargando');
    try { await subirFoto(t.dataset.foto, t.files[0]); guardado('Foto actualizada'); pintarCarta(); }
    catch (err) { alert(err.message); th.classList.remove('cargando'); }
    return;
  }
  if (t.dataset.salsas) { await api(`panel/categorias/${t.dataset.salsas}`, { method: 'PATCH', body: { salsas: t.checked } }); guardado(t.checked ? 'Ofrece salsas' : 'Sin salsas'); return; }
  if (!t.dataset.p) return;
  try {
    await api(`panel/productos/${t.dataset.p}`, { method: 'PATCH', body: { [t.dataset.f]: t.checked } });
    const p = prodPorId(t.dataset.p); p[t.dataset.f] = t.checked ? 1 : 0;
    pintarFiltros();
    if (t.dataset.f === 'activo') { t.closest('.prow').classList.toggle('off', !t.checked); guardado(t.checked ? `${p.nombre}: disponible` : `${p.nombre}: no disponible`); }
    else guardado(t.checked ? `${p.nombre} se sugerirá` : `${p.nombre} ya no se sugiere`);
  } catch (err) { alert(err.message); t.checked = !t.checked; }
};

// Un formulario por secciones (con índice a la izquierda en pantallas anchas) y una sola
// barra de "Guardar" que aparece apenas hay cambios y no deja salir sin avisar.
const DIAS = [['1', 'Lunes'], ['2', 'Martes'], ['3', 'Miércoles'], ['4', 'Jueves'], ['5', 'Viernes'], ['6', 'Sábado'], ['0', 'Domingo']];
const BANCOS = ['BancoEstado', 'Banco de Chile', 'Santander', 'BCI', 'Scotiabank', 'Itaú', 'Banco Security', 'Banco Falabella', 'Banco Ripley',
  'Banco Consorcio', 'Banco Internacional', 'Banco BICE', 'Coopeuch', 'Tenpo', 'Mercado Pago', 'MACH', 'Copec Pay'];
const TIPOS = ['Cuenta corriente', 'Cuenta vista', 'CuentaRUT', 'Cuenta de ahorro'];
// RUT chileno: formato 12.345.678-9 y dígito verificador (módulo 11).
function rutFormato(v) {
  const s = String(v || '').toUpperCase().replace(/[^\dK]/g, ''); if (s.length < 2) return s;
  return s.slice(0, -1).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + s.slice(-1);
}
function rutValido(v) {
  const s = String(v || '').toUpperCase().replace(/[^\dK]/g, ''); if (s.length < 2) return false;
  let suma = 0, m = 2; for (const d of s.slice(0, -1).split('').reverse()) { suma += Number(d) * m; m = m === 7 ? 2 : m + 1; }
  const dv = 11 - (suma % 11);
  return s.slice(-1) === (dv === 11 ? '0' : dv === 10 ? 'K' : String(dv));
}

const marcarSucio = (on) => { localSucio = on; $('lbar')?.classList.toggle('on', on); };

    return `<tr><th><label class="ck"><input type="checkbox" data-${pre}abre="${d}" ${h ? 'checked' : ''}> ${n}</label></th>
      <td><input type="time" data-${pre}desde="${d}" value="${h ? h[0] : b[0]}" ${h ? '' : 'disabled'} aria-label="${n} desde"></td>
      <td><input type="time" data-${pre}hasta="${d}" value="${h ? h[1] : b[1]}" ${h ? '' : 'disabled'} aria-label="${n} hasta"></td></tr>`; }).join('')}</table>`;
}

}
function pintarModoDesp() {
  $('v-despacho').querySelectorAll('[data-dmodo]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.dmodo === DS.modo));
  $('v-despacho').querySelectorAll('[data-dtam]').forEach((b) => b.setAttribute('aria-pressed', Number(b.dataset.dtam) === DS.tam));
  $('ds-fijo').hidden = DS.modo !== 'fijo'; $('ds-zonas').hidden = DS.modo !== 'zonas';
  $('ds-tamayuda').textContent = `Cada sector mide ${TAMS.find(([v]) => v === DS.tam)?.[2] || `${DS.tam} m`}. Más chicos = más precisión al ajustar a mano.`;
  const n = Object.keys(DS.ajustes).length, nb = Object.values(DS.ajustes).filter((x) => x === null).length;
  $('ds-ajustes').innerHTML = n ? `${n} sector${n > 1 ? 'es' : ''} ajustado${n > 1 ? 's' : ''} a mano${nb ? ` (${nb} bloqueado${nb > 1 ? 's' : ''})` : ''}. <button type="button" class="link" id="ds-limpiar">Quitar ajustes</button>` : 'Toca un sector del mapa para cambiarle el precio o bloquearlo.';
  $('ds-limpiar')?.addEventListener('click', () => { if (confirm('¿Quitar todos los ajustes hechos a mano?')) { DS.ajustes = {}; marcarDespSucio(true); pintarModoDesp(); dibujarZonas(); } });
  $('ds-mapayuda').textContent = DS.modo === 'zonas' ? 'Toca un sector para cambiar su precio o bloquearlo. Arrastra el pin del local si no está en su lugar.' : 'Con precio único no se usan zonas: cualquier dirección paga lo mismo. Arrastra el pin si el local no está en su lugar.';
  pintarEstadoDesp(); dibujarZonas();
}
function pintarTramos() {
  $('ds-tramos').innerHTML = `<div class="tramo th"><span></span><span>Hasta</span><span>Cuesta</span><span></span></div>` + DS.tramos.map((t, i) => `<div class="tramo">
    <i style="background:${COLORES[i % COLORES.length]}"></i>
    <div class="kmin"><input inputmode="decimal" value="${(t.hasta / 1000).toLocaleString('es-CL')}" data-thasta="${i}" aria-label="Tramo ${i + 1}: hasta cuántos km"><span>km</span></div>
    ${dinero('', t.costo, `data-tcosto="${i}" aria-label="Tramo ${i + 1}: costo"`)}
    <button type="button" class="pedit" data-tquitar="${i}" aria-label="Quitar tramo" ${DS.tramos.length > 1 ? '' : 'disabled'}>${ico('x')}</button></div>`).join('');
  $('ds-tramos').querySelectorAll('[data-thasta]').forEach((inp) => inp.onchange = () => {
    const n = Math.round(Number(inp.value.replace(',', '.')) * 1000);
    if (!(n >= 100)) { inp.value = (DS.tramos[inp.dataset.thasta].hasta / 1000).toLocaleString('es-CL'); return; }
    DS.tramos[inp.dataset.thasta].hasta = n; DS.tramos.sort((a, b) => a.hasta - b.hasta); pintarTramos(); pintarEstadoDesp(); dibujarZonas();
  });
  $('ds-tramos').querySelectorAll('[data-tcosto]').forEach((inp) => inp.onchange = () => { DS.tramos[inp.dataset.tcosto].costo = digitos(inp.value); pintarEstadoDesp(); dibujarZonas(); });
  $('ds-tramos').querySelectorAll('[data-tquitar]').forEach((b) => b.onclick = () => { DS.tramos.splice(Number(b.dataset.tquitar), 1); marcarDespSucio(true); pintarTramos(); pintarEstadoDesp(); dibujarZonas(); });
}
function iniciarMapa() {
  if (dmapa) { dmapa.remove(); dmapa = null; }
  const o = DS.ubicacion || { lat: -36.8270, lng: -73.0503 };
  dmapa = L.map('dmapa', { zoomControl: true, attributionControl: true }).setView([o.lat, o.lng], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(dmapa);
  dcapa = L.layerGroup().addTo(dmapa);
  dpin = L.marker([o.lat, o.lng], { draggable: true, icon: L.divIcon({ className: 'pinlocal', html: '<span>🏠</span>', iconSize: [36, 36], iconAnchor: [18, 34] }), zIndexOffset: 1000 })
    .addTo(dmapa).bindTooltip('El local (arrástralo para ajustar)', { direction: 'top', offset: [0, -30] });
  dpin.on('dragend', () => {
    const p = dpin.getLatLng();
    if (Object.keys(DS.ajustes).length && !confirm('Al mover el local los sectores cambian de lugar y se pierden los ajustes a mano. ¿Seguir?')) { dpin.setLatLng([DS.ubicacion.lat, DS.ubicacion.lng]); return; }
    DS.ajustes = {}; DS.ubicacion = { lat: p.lat, lng: p.lng }; marcarDespSucio(true); pintarModoDesp();
  });
  setTimeout(() => { dmapa.invalidateSize(); dibujarZonas(true); }, 50);
}
function dibujarZonas(encuadrar = false) {
  if (!dmapa || !dcapa) return;
  dcapa.clearLayers();
  const o = DS.ubicacion; if (!o) return;
  if (DS.modo !== 'zonas') { $('ds-leyenda').innerHTML = ''; return; }
  const z = H.hexesZona({ tam: DS.tam, tramos: DS.tramos, ajustes: DS.ajustes }, o), puntos = [];
  for (const h of z) {
    const verts = H.vertices(o, DS.tam, h.q, h.r).map((p) => [p.lat, p.lng]); puntos.push(...verts);
    const bloq = !h.ok && h.motivo === 'bloqueado', fuera = !h.ok && !bloq;
    const pol = L.polygon(verts, { color: bloq ? '#495057' : '#ffffff', weight: h.ajustado || bloq ? 2 : 1, dashArray: h.ajustado || bloq ? '4 3' : null,
      fillColor: fuera ? '#adb5bd' : bloq ? '#343a40' : colorDe(h.costo), fillOpacity: fuera ? 0.08 : bloq ? 0.45 : 0.38 }).addTo(dcapa);
    pol.bindTooltip(fuera ? `Fuera de zona · ${km(h.distancia)}` : bloq ? 'Bloqueado' : `${clp(h.costo)} · ${km(h.distancia)}${h.ajustado ? ' (a mano)' : ''}`, { sticky: true });
    pol.on('click', (e) => editarHex(h, e.latlng));
  }
  $('ds-leyenda').innerHTML = DS.tramos.map((t, i) => `<span><i style="background:${COLORES[i % COLORES.length]}"></i>Hasta ${km(t.hasta)} · ${clp(t.costo)}</span>`).join('')
    + '<span><i style="background:#343a40"></i>Bloqueado</span><span><i style="background:#dee2e6"></i>Fuera de zona</span>';
  if (encuadrar && puntos.length) dmapa.fitBounds(puntos, { padding: [12, 12] });
}
function editarHex(h, donde) {
  const actual = DS.ajustes[h.id];
  const base = H.precioHex({ tam: DS.tam, tramos: DS.tramos, ajustes: {} }, DS.ubicacion, h.q, h.r);
  const div = document.createElement('div'); div.className = 'hexpop';
  div.innerHTML = `<b>Sector a ${km(h.distancia)}</b><small>${base.ok ? `Por distancia: ${clp(base.costo)}` : 'Por distancia: fuera de zona'}</small>
    <div class="money"><span>$</span><input inputmode="numeric" value="${h.ok ? miles(h.costo) : ''}" placeholder="Precio"></div>
    <div class="hexbtns"><button type="button" class="primary" data-h="precio">Usar este precio</button>
      <button type="button" class="ghostb peligro" data-h="bloquear" ${actual === null ? 'disabled' : ''}>Bloquear sector</button>
      ${h.id in DS.ajustes ? '<button type="button" class="ghostb" data-h="volver">Volver al precio por distancia</button>' : ''}</div>`;
  const pop = L.popup({ minWidth: 220 }).setLatLng(donde).setContent(div).openOn(dmapa);
  setTimeout(() => div.querySelector('input').focus(), 50);
  div.onclick = (e) => {
    const b = e.target.closest('[data-h]'); if (!b) return;
    if (b.dataset.h === 'precio') { const n = digitos(div.querySelector('input').value); if (!n && !confirm('¿Despacho gratis en este sector?')) return; DS.ajustes[h.id] = n; }
    if (b.dataset.h === 'bloquear') DS.ajustes[h.id] = null;
    if (b.dataset.h === 'volver') delete DS.ajustes[h.id];
    dmapa.closePopup(pop); marcarDespSucio(true); pintarModoDesp();
  };
  div.querySelector('input').onkeydown = (e) => { if (e.key === 'Enter') div.querySelector('[data-h=precio]').click(); };
}
function probarEn(lat, lng, nombre) {
  if (dprueba) dprueba.remove();
  const c = DS.modo === 'zonas' ? H.cotizar({ tam: DS.tam, tramos: DS.tramos, ajustes: DS.ajustes }, DS.ubicacion, lat, lng) : { ok: true, costo: DS.costo, distancia: Math.round(H.distancia(DS.ubicacion, { lat, lng })) };
  dprueba = L.marker([lat, lng], { icon: L.divIcon({ className: 'pincliente', html: '<span>📍</span>', iconSize: [30, 30], iconAnchor: [15, 28] }) }).addTo(dmapa)
    .bindPopup(`<b>${esc(nombre)}</b><br>${c.ok ? `Despacho ${clp(c.costo)} · ${km(c.distancia)}` : c.motivo === 'bloqueado' ? 'Sector bloqueado: no se despacha' : `Fuera de la zona (${km(c.distancia)})`}`).openPopup();
  dmapa.setView([lat, lng], Math.max(dmapa.getZoom(), 14));
}
async function guardarDespacho() {
  const q = (sel) => $('v-despacho').querySelector(sel);
  const horario = Object.fromEntries(DIAS.map(([d]) => [d, q(`[data-dabre="${d}"]`).checked ? [q(`[data-ddesde="${d}"]`).value, q(`[data-dhasta="${d}"]`).value] : null]));
  $('ds-guardar').disabled = true; $('ds-err').textContent = '';
  try {
    const body = { despacho: { activo: DS.activo, costo: digitos($('ds-costo').value), minimo: digitos($('ds-minimo').value), zona: $('ds-zona').value, horario,
      modo: DS.modo, tam: DS.tam, tramos: DS.tramos, ajustes: DS.ajustes } };
    const u = M.local.ubicacion;
    if (DS.ubicacion && (!u || u.lat !== DS.ubicacion.lat || u.lng !== DS.ubicacion.lng)) body.ubicacion = DS.ubicacion;
    await api('panel/local', { method: 'PATCH', body });
    marcarDespSucio(false); toast('✓ Despacho guardado'); await cargarCarta(); pintarDespacho();
  } catch (e) { $('ds-err').textContent = e.message; }
  $('ds-guardar').disabled = false;
}

// ---------- resumen semanal ----------
let semana = null;
const fechaCorta = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('es-CL', { day: 'numeric', month: 'short' });
const diaCorto = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('es-CL', { weekday: 'short' }).replace('.', '');
const hh = (h) => `${String(h).padStart(2, '0')}:00`;
// Barras de una sola serie: un solo color (marca), sin leyenda; el título nombra la serie.
// Etiqueta directa solo en el máximo; tooltip al pasar o enfocar; tabla equivalente debajo.
function barras(datos, { etiqueta, valor, formato, titulo, corto }) {
  const max = Math.max(1, ...datos.map(valor));
  const iMax = datos.findIndex((d) => valor(d) === max && max > 0);
  return `<figure class="chart"><figcaption>${titulo}</figcaption>
    <div class="bars" role="img" aria-label="${esc(titulo)}">${datos.map((d, i) => `
      <div class="bar-col" tabindex="0" data-tip="${esc(etiqueta(d))}: ${esc(formato(valor(d)))}">
        <span class="bar-val">${i === iMax ? esc(corto ? corto(valor(d)) : formato(valor(d))) : ''}</span>
        <span class="vbar" style="height:${valor(d) ? Math.max(3, (valor(d) / max) * 100) : 0}%"></span>
      </div>`).join('')}</div>
    <div class="bars-x">${datos.map((d) => `<span>${esc(etiqueta(d))}</span>`).join('')}</div>
    <details class="tabla"><summary>Ver como tabla</summary><table>${datos.map((d) => `<tr><td>${esc(etiqueta(d))}</td><td class="r">${esc(formato(valor(d)))}</td></tr>`).join('')}</table></details>
  </figure>`;
}
function textoResumen(s) {
  const v = s.variacion === null ? '' : ` (${s.variacion >= 0 ? '+' : ''}${s.variacion}% vs. semana anterior)`;
  return [`*Resumen ${D.local}* · semana del ${fechaCorta(s.semana.desde)} al ${fechaCorta(s.semana.hasta)}`, '',
    `1. Pedidos: ${s.pedidos}${v}`,
    `2. Ticket promedio: ${clp(s.ticket)}`,
    `3. Más vendido: ${s.mas_vendido ? `${s.mas_vendido.nombre} (${s.mas_vendido.n})` : '—'}${s.menos_vendido ? ` · menos: ${s.menos_vendido.nombre} (${s.menos_vendido.n})` : ''}`,
    `4. Hora peak: ${s.peak ? hh(s.peak.hora) : '—'}${s.valle ? ` · hora valle: ${hh(s.valle.hora)}` : ''}`,
    `5. Clientes que repitieron: ${s.repiten} de ${s.clientes_web}`,
    `6. Comisión ahorrada: ${clp(s.comision_ahorrada)} (pedidos directos vs. ${s.comision_app}% de la app)`,
    `Extra: venta sugerida ${clp(s.sugeridos.ventas)} (${s.sugeridos.unidades} productos)`].join('\n');
}
async function pintarResumen() {
  const s = await api(`panel/resumen${semana ? `?semana=${semana}` : ''}`);
  semana = s.semana.desde;
  const hoyLun = (await api('panel/resumen')).semana.desde;
  const flecha = s.variacion === null ? '' : `<span class="delta ${s.variacion >= 0 ? 'up' : 'down'}">${s.variacion >= 0 ? '▲' : '▼'} ${Math.abs(s.variacion)}% <span>vs. semana anterior (${s.pedidos_prev})</span></span>`;
  $('v-resumen').innerHTML = `
    <div class="res-head">
      <div style="display:flex;align-items:center;gap:6px">
        <button class="ghost ico-b" data-sem="-7" aria-label="Semana anterior">${ico('left')}</button>
        <h2 class="t" style="margin:0">Semana del ${fechaCorta(s.semana.desde)} al ${fechaCorta(s.semana.hasta)}</h2>
        <button class="ghost ico-b" data-sem="7" aria-label="Semana siguiente" ${s.semana.desde >= hoyLun ? 'disabled' : ''}>${ico('right')}</button>
      </div>
      <a class="primary" style="flex:0 0 auto;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(textoResumen(s))}">${ico('msg')}Enviar por WhatsApp</a>
    </div>
    ${s.pedidos ? '' : '<p class="vacio">Esta semana todavía no hay ventas registradas.</p>'}
    <div class="kpis kpis6">
      <div><span class="k">1 · Pedidos</span><b class="num">${s.pedidos}</b>${flecha}</div>
      <div><span class="k">2 · Ticket promedio</span><b class="num">${clp(s.ticket)}</b><span class="sub">${clp(s.ventas)} vendidos</span></div>
      <div><span class="k">3 · Más vendido</span><b class="txt">${s.mas_vendido ? esc(s.mas_vendido.nombre) : '—'}</b>
        <span class="sub">${[s.mas_vendido && `${s.mas_vendido.n} vendidos`, s.menos_vendido && `menos: ${esc(s.menos_vendido.nombre)} (${s.menos_vendido.n})`, s.sin_ventas && `${s.sin_ventas} sin ventas`].filter(Boolean).join(' · ')}</span></div>
      <div><span class="k">4 · Hora peak</span><b class="num">${s.peak ? hh(s.peak.hora) : '—'}</b><span class="sub">${s.valle ? `Hora valle: ${hh(s.valle.hora)} · buena para una promo` : ''}</span></div>
      <div><span class="k">5 · Clientes que repitieron</span><b class="num">${s.repiten}</b><span class="sub">de ${s.clientes_web} clientes web</span></div>
      <div class="destacado"><span class="k">6 · Comisión ahorrada</span><b class="num">${clp(s.comision_ahorrada)}</b><span class="sub">${s.canal.web.pedidos} pedidos directos × ${s.comision_app}% que cobraría la app</span></div>
    </div>
    <p class="extra-sug"><b>Venta sugerida:</b> <span class="num">${clp(s.sugeridos.ventas)}</span> en ${s.sugeridos.unidades} producto${s.sugeridos.unidades === 1 ? '' : 's'} agregados desde las sugerencias (papas, bebidas…)${s.ventas ? ` · ${Math.round(s.sugeridos.ventas * 100 / s.ventas)}% de las ventas` : ''}.</p>
    <div class="charts">
      ${barras(s.por_dia, { titulo: 'Ventas por día', etiqueta: (d) => diaCorto(d.dia), valor: (d) => d.ventas, formato: clp })}
      ${barras(s.por_hora, { titulo: 'Pedidos por hora', etiqueta: (d) => String(d.hora).padStart(2, '0'), valor: (d) => d.pedidos, formato: (n) => `${n} pedido${n === 1 ? '' : 's'}`, corto: String })}
    </div>
    <div class="charts">
      <div><h3>Por canal</h3><table><tr><th></th><th class="r">Pedidos</th><th class="r">Ventas</th></tr>
        <tr><td>Web (directo)</td><td class="r">${s.canal.web.pedidos}</td><td class="r">${clp(s.canal.web.ventas)}</td></tr>
        <tr><td>Mostrador</td><td class="r">${s.canal.mostrador.pedidos}</td><td class="r">${clp(s.canal.mostrador.ventas)}</td></tr></table></div>
      <div><h3>Platos de la semana</h3>${s.platos.length ? `<table><tr><th>Plato</th><th class="r">Unidades</th><th class="r">Ventas</th></tr>${s.platos.slice(0, 10).map((x) =>
        `<tr><td>${esc(x.nombre)}</td><td class="r">${x.n}</td><td class="r">${clp(x.monto)}</td></tr>`).join('')}</table>` : '<p class="vacio">Sin ventas.</p>'}</div>
    </div>
    <p class="ayuda">La comisión ahorrada usa ${s.comision_app}% (se ajusta en Datos del local). Las ventas de mostrador no cuentan porque no pasarían por la app.</p>`;
  $('v-resumen').querySelectorAll('[data-sem]').forEach((b) => b.onclick = () => {
    const d = new Date(`${semana}T12:00:00`); d.setDate(d.getDate() + Number(b.dataset.sem));
    semana = d.toISOString().slice(0, 10); pintarResumen();
  });
}
// Tooltip de las barras: al pasar el mouse o con el foco del teclado.
const tip = Object.assign(document.createElement('div'), { className: 'tip', role: 'tooltip' });
document.body.append(tip);
for (const ev of ['mouseover', 'focusin']) document.addEventListener(ev, (e) => {
  const c = e.target.closest?.('[data-tip]'); if (!c) return;
  tip.textContent = c.dataset.tip; tip.classList.add('on');
  const r = c.getBoundingClientRect();
  tip.style.left = `${Math.min(innerWidth - 8 - tip.offsetWidth, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2))}px`;
  tip.style.top = `${r.top + scrollY - tip.offsetHeight - 6}px`;
});
for (const ev of ['mouseout', 'focusout']) document.addEventListener(ev, (e) => { if (e.target.closest?.('[data-tip]')) tip.classList.remove('on'); });

// ---------- navegación ----------
document.querySelectorAll('[data-v]').forEach((b) => b.onclick = async () => {
  if (vista === 'local' && b.dataset.v !== 'local' && localSucio && !confirm('Tienes cambios sin guardar en Datos del local. ¿Salir sin guardar?')) return;
  if (vista === 'despacho' && b.dataset.v !== 'despacho' && despSucio && !confirm('Tienes cambios del despacho sin guardar. ¿Salir sin guardar?')) return;
  if (b.dataset.v !== 'local') marcarSucio(false);
  if (b.dataset.v !== 'despacho') marcarDespSucio(false);
  vista = b.dataset.v;
  document.querySelectorAll('[data-v]').forEach((x) => x.setAttribute('aria-selected', x === b));
  b.scrollIntoView({ inline: 'center', block: 'nearest' }); // en pantallas angostas las pestañas se desplazan
  for (const v of ['pedidos', 'venta', 'cierre', 'carta', 'local', 'resumen', 'despacho']) $('v-' + v).hidden = v !== vista;
  if (vista === 'carta') pintarCarta();
  else if (vista === 'resumen') pintarResumen();
  else if (vista === 'local') pintarLocal();
  else if (vista === 'despacho') { await cargarCarta(); pintarDespacho(); }
  else if (vista === 'venta') { await cargarCarta(); pintarVenta(); }
  else refrescar();
});
$('salir').onclick = async () => { await api('panel/logout', { method: 'POST' }); location.reload(); };

// La tablet del local no debe apagar la pantalla mientras el panel está abierto: si se apaga,
// nadie oye ni ve los pedidos nuevos. El navegador suelta el bloqueo al ocultar la pestaña,
// así que se vuelve a pedir al volver.
let bloqueo = null;
async function despierta() {
  if (!('wakeLock' in navigator) || document.hidden || bloqueo) return;
  try { bloqueo = await navigator.wakeLock.request('screen'); bloqueo.addEventListener('release', () => { bloqueo = null; }); } catch {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('app').hidden) despierta(); });
async function iniciar() {
  try { await refrescar(); } catch (e) { if (e.status === 401) { $('login').hidden = false; $('clave').focus(); return; } throw e; }
  $('app').hidden = false;
  despierta();
  setInterval(() => !['carta', 'local', 'resumen'].includes(vista) && refrescar().catch((e) => e.status === 401 && location.reload()), 3000);
}
$('entrar').onclick = async () => {
  try { await api('panel/login', { method: 'POST', body: { password: $('clave').value } }); $('login').hidden = true; iniciar(); }
  catch (e) { $('loginErr').textContent = e.message; }
};
$('clave').onkeydown = (e) => e.key === 'Enter' && $('entrar').click();
iniciar();
</script>
</body>
</html>
