<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Cartel con QR</title>
<style>
  :root { --ink: #241c17; --brand: #c1121f; --crema: #f6efe6; --gris: #6b5f57; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9e2d8; color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .barra { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 12px 16px; background: var(--ink); }
  .barra button { font: 600 .95rem Inter, sans-serif; border: 0; border-radius: 999px; padding: 10px 16px; cursor: pointer; background: #ffffff1a; color: #fff; }
  .barra button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .barra .imp { background: var(--brand); color: #fff; }
  .barra p { flex-basis: 100%; margin: 0; text-align: center; color: #f6efe6b3; font-size: .82rem; }
  .hoja { width: 210mm; height: 297mm; margin: 16px auto; background: var(--crema); overflow: hidden; box-shadow: 0 6px 30px #0003; position: relative; }
  .msg { max-width: 560px; margin: 40px auto; text-align: center; font-size: 1.05rem; }
  [hidden] { display: none !important; }

  /* Cartel A4 */
  .cartel { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .cartel .top { width: 100%; background: var(--ink); padding: 14mm 0 20mm; display: grid; place-items: center; position: relative; }
  .cartel .top::after { content: ""; position: absolute; right: -30mm; top: -30mm; width: 90mm; height: 90mm; border-radius: 50%; background: var(--brand); opacity: .9; }
  .cartel .top img { width: 130mm; height: auto; position: relative; z-index: 1; filter: drop-shadow(0 3mm 4mm #0006); }
  .cartel h1 { font: 800 21mm/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; margin: 10mm 0 3mm; }
  .cartel .sub { font: 600 7mm/1.25 Inter, sans-serif; color: var(--gris); margin: 0 0 8mm; }
  .cartel .qr { background: #fff; padding: 7mm; border-radius: 8mm; box-shadow: 0 2mm 8mm #241c1722; }
  .cartel .qr svg { width: 84mm; height: 84mm; display: block; }
  .cartel .esc { font: 700 6mm Inter, sans-serif; margin: 7mm 0 1.5mm; }
  .cartel .url { font: 600 5.2mm Inter, sans-serif; color: var(--brand); }
  .cartel .pie { position: absolute; bottom: 0; left: 0; right: 0; padding: 7mm 14mm; display: flex; justify-content: center; gap: 10mm; font: 600 4.6mm Inter, sans-serif; color: var(--gris); border-top: .4mm solid #241c1722; }

  /* Tarjetas: 8 por hoja A4 (2 × 4), para pegar en bolsas o entregar con el pedido */
  .tarjetas { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, 1fr); padding: 6mm; gap: 0; }
  .tj { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 5mm; padding: 6mm 7mm; border: .3mm dashed #241c1740; background: var(--crema); }
  .tj img { width: 44mm; height: auto; display: block; margin-bottom: 3mm; }
  .tj b { display: block; font: 800 6mm/1.05 "Bricolage Grotesque", sans-serif; letter-spacing: -.01em; }
  .tj span { display: block; font-size: 3.3mm; color: var(--gris); margin-top: 2mm; line-height: 1.3; }
  .tj .url { color: var(--brand); font-weight: 700; margin-top: 2.5mm; }
  .tj .qr { background: #fff; padding: 2mm; border-radius: 3mm; }
  .tj .qr svg { width: 30mm; height: 30mm; display: block; }

  @page { size: A4; margin: 0; }
  @media print {
    body { background: none; }
    .barra { display: none; }
    .hoja { margin: 0; box-shadow: none; page-break-after: always; }
  }
</style>
</head>
<body>
<div class="barra">
  <button type="button" data-modo="cartel" aria-pressed="true">Cartel A4 (mostrador)</button>
  <button type="button" data-modo="tarjetas" aria-pressed="false">Tarjetas × 8 (bolsas)</button>
  <button type="button" class="imp" data-print>Imprimir o guardar PDF</button>
  <p>En el diálogo de impresión: tamaño A4, márgenes "Ninguno" y "Gráficos de fondo" activado.</p>
</div>
<div id="hojas"><p class="msg">Cargando…</p></div>
<script src="qrcode.js"></script>
<script type="module">
import { api, esc, BASE, fmtTel } from './comun.js';
let M;
try { M = await api('panel/carta'); }
catch (e) {
  document.getElementById('hojas').innerHTML = `<p class="msg">${e.status === 401 ? `Primero entra al <a href="${BASE}/panel">panel</a> con la clave del local y vuelve a abrir esta página.` : 'No se pudo cargar. Recarga la página.'}</p>`;
  throw e;
}
const L = M.local;
const url = `${location.origin}${BASE}/${L.slug}`;
const corta = url.replace(/^https?:\/\//, '');
// QR como SVG de un solo trazado: nítido a cualquier tamaño de impresión.
function qrSvg(texto) {
  const q = qrcode(0, 'M'); q.addData(texto); q.make();
  const n = q.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c} ${r}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="Código QR a ${esc(corta)}"><path d="${d}" fill="#241c17"/></svg>`;
}
const qr = qrSvg(url);
const logo = L.logo ? `<img src="${esc(L.logo)}" alt="${esc(L.nombre)}">` : `<b style="font:800 18mm 'Bricolage Grotesque';color:#fff">${esc(L.nombre)}</b>`;
const contacto = [L.whatsapp ? `WhatsApp ${fmtTel(L.whatsapp)}` : '', L.instagram ? `@${L.instagram}` : '', L.direccion || ''].filter(Boolean).map(esc);
const cartel = () => `<section class="hoja cartel">
  <div class="top">${logo}</div>
  <h1>Pide en línea</h1>
  <p class="sub">y retira sin fila${L.despacho?.activo ? ' o recíbelo en tu casa' : ''}.<br>Precio de local, sin comisiones de apps.</p>
  <div class="qr">${qr}</div>
  <div class="esc">Escanea con la cámara de tu celular</div>
  <div class="url">${esc(corta)}</div>
  <div class="pie">${contacto.map((c) => `<span>${c}</span>`).join('')}</div>
</section>`;
const tarjetas = () => `<section class="hoja tarjetas">${Array(8).fill(`<div class="tj"><div>
  ${L.logo ? `<img src="${esc(L.logo)}" alt="">` : ''}<b>¿Repetimos?<br>Pide directo</b>
  <span>Precio de local, sin comisiones de apps.</span><span class="url">${esc(corta)}</span></div>
  <div class="qr">${qr}</div></div>`).join('')}</section>`;
const pintar = (modo) => {
  document.getElementById('hojas').innerHTML = modo === 'tarjetas' ? tarjetas() : cartel();
  document.querySelectorAll('[data-modo]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.modo === modo));
};
document.querySelectorAll('[data-modo]').forEach((b) => b.onclick = () => pintar(b.dataset.modo));
pintar('cartel');
</script>
</body>
</html>
