# n8n.8vobit.xyz: bot de DM de Instagram de 8vobit (ver OPERACION.md y bot/).
# En el servidor vive en /srv/docker/compose/n8n/. Los secretos van en .env (fuera de git).
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    container_name: n8n
    restart: unless-stopped
    # Solo 127.0.0.1: la entrada es el túnel de Cloudflare. Nunca 0.0.0.0 (Docker se salta UFW).
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    environment:
      N8N_HOST: n8n.8vobit.xyz
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_WEBHOOK_URL: https://n8n.8vobit.xyz/
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: America/Santiago
      TZ: America/Santiago
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # El flujo lee los secretos de Instagram desde variables de entorno y verifica la firma con crypto.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    volumes:
      - n8n-data:/home/node/.n8n
    # lenovo-edge tiene 7,5 GB y Immich reserva ~5 GB: n8n queda acotado.
    mem_limit: 512m
    memswap_limit: 768m
    cpus: 1.0
volumes:
  n8n-data:
